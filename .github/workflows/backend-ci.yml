name: backend-ci

# Unit tests for the Node backend on every PR and every push to dev.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: backend tests (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Security header tests
        run: npm run --if-present test:security

      - name: Rate limiter tests
        run: npm run --if-present test:ratelimit

      - name: Production config isolation tests
        working-directory: .
        run: node --test ./test/prod-config-isolation.test.js
